name: Test CI/CD Workflow

on:
  push:
    branches:
      - main
      - frontend  # Also triggers when you push to frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run test build
        run: |
          echo "Running DevBoard test build"
          npm install
          npm run build || echo "Build step skipped for testing"
